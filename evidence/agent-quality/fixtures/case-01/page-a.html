<!doctype html>
<!-- Synthetic practice input: local practice page saved at the failing step. Not a real site. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="practice-input" content="synthetic" />
    <title>Your cart</title>
  </head>
  <body>
    <h1>Your cart</h1>
    <ul aria-label="Cart lines">
      <li data-testid="cart-line">
        <span data-testid="line-name">Trail Socks · Grey</span>
        <span>Unit price <span data-testid="line-unit">€7.50</span></span>
        <span>Quantity <span data-testid="line-qty">2</span></span>
        <span>Line total <span data-testid="line-total">€7.50</span></span>
        <button type="button" data-testid="line-remove">Remove</button>
      </li>
    </ul>
    <p>Subtotal <span data-testid="cart-subtotal">€7.50</span></p>
    <button type="button" data-testid="checkout-button">Proceed to checkout</button>
  </body>
</html>
