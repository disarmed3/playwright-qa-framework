<!doctype html>
<!-- Synthetic practice input: local practice page saved 900 ms after the click. Not a real site. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="practice-input" content="synthetic" />
    <title>Your cart</title>
  </head>
  <body>
    <h1>Your cart</h1>
    <ul aria-label="Cart lines">
      <li data-testid="cart-line">
        <span data-testid="line-name">Trail Bottle · Green</span>
        <span>Quantity <span data-testid="line-qty">1</span></span>
        <span>Line total <span data-testid="line-total">€20.00</span></span>
      </li>
    </ul>
    <label>Coupon code <input type="text" data-testid="coupon-input" value="PRACTICE10" /></label>
    <button type="button" data-testid="coupon-apply">Apply</button>
    <p data-testid="discount-row">Discount (PRACTICE10) −€2.00</p>
    <p>Total <span data-testid="cart-total">€18.00</span></p>
  </body>
</html>
